<style>
@font-face {
  font-family: 'TsangerJinKai';
  src: url('/Users/limbo/work/github/write-anything/assets/TsangerJinKai02-W04.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  background: #0e0e0e; color: #fff; padding: 48px 32px;
}
h1 {
  font-family: 'TsangerJinKai', serif;

h2 {

}
h2:first-of-type { margin-top: 0; }

.grid { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }

.card-link {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-decoration: none;
}
.card-frame {
  width: 216px; height: 288px;
  border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
  overflow: hidden; background: #1a1a1a;
}
.card-frame iframe {
  width: 540px; height: 720px;
  transform: scale(0.4); transform-origin: top left;
  border: none; pointer-events: none;
}
.card-name { font-size: 13px; color: #bbb; }
.card-desc { font-size: 11px; color: #555; max-width: 216px; text-align: center; line-height: 1.5; }
