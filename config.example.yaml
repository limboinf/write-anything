# write-anything 配置
# 复制为 config.yaml 并填入你的信息
# 首次使用时 Agent 会通过对话引导你自动生成

# ── 全局配置 ──

default_platform: "toutiao"      # 默认目标平台（toutiao / xiaohongshu / twitter）
industry: "行业"
# blacklist:
#   words: ["禁忌词1", "禁忌词2"]
#   topics: ["禁忌话题1"]

# ── 平台配置（每个平台独立） ──

platforms:
  toutiao:
    name: "账号名称"
    topics:
      - "方向1"
      - "方向2"
    tone: "写作风格描述"           # 如"专业但不学术，有观点但不偏激"
    voice: "第一人称"
    # target_audience: "目标受众描述"
    # cover_style: "封面风格描述"
    # reference_accounts: ["参考账号1"]

  xiaohongshu:
    name: "账号名称"
    topics:
      - "方向1"
    tone: "轻松口语化"
    voice: "第一人称"

  twitter:
    name: "账号名称"
    topics:
      - "方向1"
    tone: "轻松专业"
    voice: "第一人称"

# ── AI 图片生成 ──

image:
  # 可选 provider: ark | gemini
  provider: "ark"

  # API Key 直接从环境变量读取
  #
  # Ark / 豆包
  # 获取 API key: https://console.volcengine.com/ark
  # 环境变量：ARK_API_KEY
  #
  # Google Gemini Imagen
  # provider: "gemini"
  # 获取 API key: https://aistudio.google.com/apikey
  # 环境变量：GEMINI_API_KEY
